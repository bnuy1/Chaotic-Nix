# Encrypt/decrypt with the system SSH host key.
# The NixOS module reads this key at boot via sops-nix.
#
# Usage:
#   # Edit values in plaintext (runs $EDITOR):
#   sudo nix-shell -p sops --run "sops secrets.yaml"
#
#   # Encrypt an existing plaintext file (uses the SSH host key as the age identity):
#   sudo nix-shell -p sops --run "SOPS_AGE_SSH_PRIVATE_KEY_FILE=/etc/ssh/ssh_host_ed25519_key sops --encrypt --in-place secrets.yaml"
#
#   # Decrypt to inspect:
#   sudo nix-shell -p sops --run "SOPS_AGE_SSH_PRIVATE_KEY_FILE=/etc/ssh/ssh_host_ed25519_key sops --decrypt secrets.yaml"

keys:
  - &host_key age1vkp98gfd99wv0pepkrhjsakg4wgl0q85j9m9l5xv5c94eh0f2cdsuggyct
creation_rules:
  - age: *host_key
