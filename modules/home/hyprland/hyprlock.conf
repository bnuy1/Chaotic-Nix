# Star it up: https://github.com/hyprwm/hyprlock

background {
    monitor =
    path = $HOME/Pictures/wallpapers
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(89B4FA)
    inner_color = rgb(1E1E2E)
    font_color = rgb(CDD6F4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
