general {
    lock_cmd = loginctl lock-session            # lock via logind (triggers quickshell WlSessionLock)
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Quickshell's "keep system awake" toggle (Idle.toggleInhibit) creates a
# wlr idle-inhibit surface; hypridle obeys wayland inhibitors by default, so
# none of the listeners below fire while it is active.

listener {
    timeout = 300                                # 5min
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# keyboard backlight follows the screen
listener {
    timeout = 300
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 330                                # 5min + 30s
    on-timeout = loginctl lock-session           # lock screen
}

# Suspends and poweroff are driven by the lockdown user service
# (~/.config/hypr/scripts/lockdown.sh) which counts from the lock event and
# only acts on battery. Idle alone never powers the machine off on AC.
